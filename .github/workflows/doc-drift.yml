# Doc-drift gate: this repo's CLAUDE.md must not document a Tina4 API the code
# does not have. Fast, no live services -- it loads the framework and checks
# every Tina4 symbol in a ```ruby fence resolves by reflection. Actions are
# pinned by commit SHA per ADR-0073.
name: Doc Drift

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

permissions:
  contents: read

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Doc-drift audit (strict)
        run: ruby -Ilib scripts/audit_doc_drift.rb --strict

      - name: Doc-drift gate mutation spec
        run: bundle exec rspec spec/doc_drift_gate_spec.rb
