name: Release packages and publication

on:
  pull_request:
    branches: [v3]
  push:
    tags: ['[0-9]*.*.*']

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build release packages and integrity evidence
        run: |
          version=$(ruby -Ilib -e 'require "tina4/version"; print Tina4::VERSION')
          bundle lock
          ruby scripts/check_version_consistency.rb "$version"
          mkdir -p dist
          gem build tina4ruby.gemspec --output "dist/tina4ruby-$version.gem"
          gem build tina4.gemspec --output "dist/tina4-$version.gem"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "$version" = "$GITHUB_REF_NAME" || { echo "Tag/source version mismatch"; exit 1; }
          fi
          python3 scripts/test_release_evidence.py
          python3 scripts/release_evidence.py --output dist --name tina4ruby --version "$version" --license MIT --repository tina4stack/tina4-ruby
          (cd dist && sha256sum --check SHA256SUMS)
          python3 -c 'import json; s=json.load(open("dist/sbom.spdx.json")); assert s["spdxVersion"] == "SPDX-2.3"; assert s["packages"] and s["files"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-ruby
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: '3.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-ruby
          path: dist
      - name: Verify immutable build artifact checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Attest package SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: dist/*.gem
          sbom-path: dist/sbom.spdx.json
      - name: Extract this version's changelog
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          marker = '## ' + os.environ['GITHUB_REF_NAME'] + '\n'
          notes = text.split(marker, 1)[1].split('\n## ', 1)[0].strip()
          if not notes:
              raise SystemExit('Release changelog is empty')
          Path('/tmp/release-notes.md').write_text(notes + '\n')
          PYNOTES
      - name: Create GitHub Release with integrity evidence
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: /tmp/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish both gems to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push "dist/tina4ruby-${GITHUB_REF_NAME}.gem"
          gem push "dist/tina4-${GITHUB_REF_NAME}.gem"
