name: Publish to RubyGems

on:
  push:
    tags:
      - '[0-9]*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # softprops/action-gh-release calls the GitHub REST API with the
    # default GITHUB_TOKEN. That token only writes to the repository if
    # the job declares contents:write — without this block, the action
    # 403s on every tag push regardless of the repo's default Workflow
    # permissions setting (Settings → Actions → General).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for git log on the tagged commit

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Verify tag matches source version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SOURCE_VERSION="$(ruby -Ilib -e 'require "tina4/version"; print Tina4::VERSION')"
          test "$SOURCE_VERSION" = "$VERSION" || {
            echo "::error::Tag $VERSION does not match lib/tina4/version.rb $SOURCE_VERSION"
            exit 1
          }
          echo "Building verified version $VERSION"

      - name: Build gems
        # Build both the real framework gem and the transitional `tina4`
        # meta-gem (a pointer that depends on tina4ruby ~> 3.0). They share
        # Tina4::VERSION, so both build at the same version.
        run: |
          gem build tina4ruby.gemspec
          gem build tina4.gemspec

      - name: Publish to RubyGems
        # Push tina4ruby first (the real framework), then the transitional
        # `tina4` meta-gem that depends on it. Keeping both in lockstep means
        # `gem install tina4` never drifts — it once stuck at 3.10.68 because
        # only tina4ruby was being pushed each release.
        run: |
          gem push tina4ruby-*.gem
          gem push tina4-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Extract release notes from commit body
        run: |
          # Pull the tagged commit body (sans Co-Authored-By trailers and
          # trailing blank lines). The body is the narrative the maintainer
          # already writes for each release — piping it straight into the
          # GitHub release beats a bare "Full Changelog" link.
          git log -1 "${GITHUB_REF_NAME}" --pretty=%B \
            | awk '/^Co-Authored-By:/ { skip=1 } !skip { print }' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > /tmp/release-notes.md
          echo "── /tmp/release-notes.md ──"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
