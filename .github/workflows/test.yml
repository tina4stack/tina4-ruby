name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration specs execute instead of skipping (the gap that let
    # the migration / queue bugs ship). Service containers are health-checked, so
    # the job fails if one never comes up. Ports mirror the local docker harness
    # (/tmp/tina4_infra_up.sh) so the same TINA4_TEST_* values work locally and here.
    services:
      # GreenMail: real SMTP 3025 + IMAP 3143 for the Messenger round-trip
      # tests. auth.disabled is REQUIRED, not laziness: every suite uses a unique
      # random recipient per test so each mailbox is created on FIRST ACCESS,
      # which cannot work against a server demanding pre-registered users.
      greenmail:
        image: greenmail/standalone:2.1.3
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled'
      # Cache backends — exercised by spec/cache_backends_spec.rb.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # PostgreSQL — exercised by the postgres ORM / migration / driver specs.
      # DB tina4_rb matches the spec defaults (spec/postgres_*_spec.rb).
      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_rb
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_rb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # MySQL — exercised by spec/database_mysql_mssql_live_spec.rb (#262).
      # DB/user/pass match the spec defaults (localhost:3306 / tina4 / tina4_test).
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # MSSQL — exercised by spec/database_mysql_mssql_live_spec.rb (#262). The
      # image starts EMPTY (no user DB), so a later step creates tina4_test.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_PID: Developer
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # RabbitMQ — the P1 broker (parity with the Python master's live RabbitMQ test).
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      # Enable the real-service integration specs (they skip when unset). Ports
      # mirror the local docker harness so the same values work locally and here.
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USERNAME: tina4
      TINA4_TEST_PG_PASSWORD: tina4
      TINA4_TEST_PG_DB: tina4_rb
      # Second Postgres database for the two-DB named-connection test
      # (spec/bind_database_spec.rb). A later step creates it once PG is healthy.
      TINA4_TEST_PG_DB_2: tina4_rb2
      # MySQL + MSSQL (#262) — match spec/database_mysql_mssql_live_spec.rb defaults.
      # HOST IS 127.0.0.1, NOT "localhost" — mysql2/libmysqlclient special-case the
      # literal string "localhost" to mean "connect via the local UNIX socket"
      # (/var/run/mysqld/mysqld.sock), ignoring the port entirely. The mysql
      # service container below is TCP-only (there is no socket file on the
      # runner), so "localhost" fails with "Can't connect to local MySQL server
      # through socket '/var/run/mysqld/mysqld.sock'" even though the port mapping
      # is correct. "127.0.0.1" forces the TCP path. Tina4::Drivers::MysqlDriver
      # already rewrites "localhost"+port to "127.0.0.1" internally (see
      # lib/tina4/drivers/mysql_driver.rb), but spec/session_database_engines_spec.rb
      # deliberately re-reads every engine OUT OF BAND through the raw mysql2 gem
      # (bypassing Tina4::Database) to prove writes really landed, so the env var
      # itself has to name the TCP host.
      TINA4_TEST_MYSQL_HOST: 127.0.0.1
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USERNAME: tina4
      TINA4_TEST_MYSQL_PASSWORD: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USERNAME: sa
      TINA4_TEST_MSSQL_PASSWORD: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      # ODBC (feature 13) — reuses the postgres service above (127.0.0.1:55432)
      # through the unixODBC "PostgreSQL Unicode" driver instead of a second
      # database container. odbcprovider_contract_spec.rb reads exactly these
      # four TINA4_TEST_ODBC_* names (spec/odbcprovider_contract_spec.rb).
      # DSN is the connection-string BODY, after "odbc:///" — DatabaseUrl#parse
      # passes it through verbatim (no URI.parse), so the "{" / ";" are safe.
      # A dedicated "tina4_odbc" database is created below (the postgres service
      # only auto-creates POSTGRES_DB=tina4_rb), and /etc/odbcinst.ini registers
      # the driver nickname "PostgreSQL Unicode" the DSN references.
      TINA4_TEST_ODBC_DSN: 'DRIVER={PostgreSQL Unicode};SERVER=127.0.0.1;PORT=55432;DATABASE=tina4_odbc;UID=tina4;PWD=tina4'
      # AUTH_DSN carries NO UID/PWD — the credentials case (spec's "credentials
      # passed as params are honoured" / "a wrong password fails loud") supplies
      # them separately via Tina4::Database.new(username:, password:) so the
      # test proves the ADAPTER appends UID=/PWD=, not that they were already
      # embedded in the string.
      TINA4_TEST_ODBC_AUTH_DSN: 'DRIVER={PostgreSQL Unicode};SERVER=127.0.0.1;PORT=55432;DATABASE=tina4_odbc'
      TINA4_TEST_ODBC_USERNAME: tina4
      TINA4_TEST_ODBC_PASSWORD: tina4
      TINA4_TEST_KAFKA_URL: localhost:9092
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      # MQTT brokers, all started by spec/support/mqtt-infra.sh below. The client
      # is hand-rolled on raw sockets, so nothing here can be proven off-broker:
      #   1883 anonymous, 1884 auth-required, 8883 TLS, 1885 EMQX (SUBACK 0x80).
      TINA4_TEST_MQTT_URL: mqtt://127.0.0.1:1883
      TINA4_TEST_MQTT_AUTH_URL: mqtt://127.0.0.1:1884
      TINA4_TEST_MQTT_TLS_URL: mqtts://127.0.0.1:8883
      TINA4_TEST_MQTT_EMQX_URL: mqtt://127.0.0.1:1885
      TINA4_TEST_MQTT_USERNAME: tina4
      TINA4_TEST_MQTT_PASSWORD: testpass
      TINA4_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_MONGO_URI: mongodb://localhost:27017
      # Compile + load the optional MySQL/MSSQL driver gems (mysql2 + tiny_tds)
      # for the live #262 specs, PLUS the optional ruby-odbc gem (feature 13) for
      # the live ODBC specs. Both groups are OPTIONAL, so each is only installed
      # where BUNDLE_WITH names it (here) plus the native client libs — the
      # Gemfile's own comment on the :odbc group warns that `bundle config set
      # --local with` REPLACES rather than appends, so this stays colon-joined
      # ("databases:odbc"), never a bare "odbc" that would silently drop mysql2/
      # tiny_tds.
      BUNDLE_WITH: databases:odbc
      # Turn a missing provisioned service into a hard failure (no green skips).
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      # The greenmail/standalone image is a bare JRE with no nc/curl, so a
      # container --health-cmd cannot run -- and a probe that cannot run looks
      # exactly like a broken service. Wait from the RUNNER instead and FAIL the
      # job if it never listens: the require-services gate now treats a
      # "greenmail not reachable" skip as fatal, so a silent no-show must be loud
      # here rather than surfacing as a confusing gate failure later.
      # shell: bash is mandatory -- /dev/tcp is a bash feature, absent in sh.
      - name: Wait for GreenMail (SMTP 3025 / IMAP 3143)
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3025) 2>/dev/null \
               && (exec 4<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "GreenMail ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "GreenMail did not become ready in 60s"; exit 1

      - uses: actions/checkout@v4

      # Extra Postgres databases beyond the service's own POSTGRES_DB=tina4_rb:
      #   tina4_rb2 - the two-DB named-connection test (spec/bind_database_spec.rb,
      #               TINA4_TEST_PG_DB_2=tina4_rb2).
      #   tina4_odbc - the ODBC provider contract spec (feature 13), reached
      #               through unixODBC's "PostgreSQL Unicode" driver rather than
      #               Tina4's native postgres driver, so it needs its own database
      #               to avoid the two suites tripping over each other's tables.
      - name: Create second Postgres database (tina4_rb2, tina4_odbc)
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_rb -c "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_rb \
            -c "CREATE DATABASE tina4_rb2" || echo "tina4_rb2 may already exist"
          PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_rb \
            -c "CREATE DATABASE tina4_odbc" || echo "tina4_odbc may already exist"

      # Password-protected Redis (requirepass s3cret) on 6381 — verifies the
      # AUTH round-trip and the wrong-password file-fallback path. Run as a
      # manual container because service-container command args (the password)
      # aren't supported by GitHub Actions service definitions.
      - name: Start password-protected Redis (6381)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 \
            redis-server --requirepass s3cret
          for i in $(seq 1 20); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      # The REAL MQTT brokers the MQTT specs drive. The client is hand-rolled on
      # raw sockets (zero dependencies), so its wire format, its CONNECT
      # credentials and its TLS verification can only be proven against real
      # brokers; there is no fake anywhere in those specs.
      #
      #   1883  Mosquitto, anonymous              protocol + session specs
      #   1884  Mosquitto, allow_anonymous false  auth accepted AND refused
      #   8883  Mosquitto, TLS (self-signed CA)   mqtts:// + the reject-without-CA negative
      #   1885  EMQX 5.8                          SUBACK 0x80 (Mosquitto cannot produce it)
      #
      # Driven by spec/support/mqtt-infra.sh — the same script a developer runs
      # from a checkout, so CI and a laptop test identical broker config (and the
      # TLS certs + hashed password file are generated the same way). Plain
      # containers, not service containers, for the same reason as redis-auth and
      # Kafka below: these need command arguments and mounted config, which a
      # GitHub service definition cannot pass. The script FAILS the job if any
      # broker never accepts a connection — a missing broker must not turn into
      # green skips (TINA4_REQUIRE_SERVICES also fails on the resulting skips).
      - name: Start MQTT brokers (Mosquitto 1883/1884/8883 + EMQX 1885)
        run: |
          bash spec/support/mqtt-infra.sh "$RUNNER_TEMP/tina4-mqtt-infra"
          echo "TINA4_TEST_MQTT_CA_FILE=$RUNNER_TEMP/tina4-mqtt-infra/certs/ca.crt" >> "$GITHUB_ENV"

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service
      # containers can't express the KRaft listener config cleanly, so run it as
      # a plain container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      # The mssql service image starts with NO user database, so create
      # tina4_test before the specs connect. sqlcmd ships at the 2022 path
      # (mssql-tools18, -C to trust the self-signed cert); fall back to the
      # legacy path for older images.
      - name: Create MSSQL tina4_test database
        run: |
          for i in $(seq 1 30); do
            if docker ps --format '{{.Names}}' | grep -q mssql; then break; fi
            sleep 1
          done
          MSSQL_CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -1)
          for i in $(seq 1 30); do
            if docker exec "$MSSQL_CID" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TinaSQL123!Secure' -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null \
               || docker exec "$MSSQL_CID" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null; then
              echo "tina4_test database ready"; exit 0
            fi
            sleep 2
          done
          echo "Could not create tina4_test on MSSQL"; exit 1

      # Native client libs for the optional #262 driver gems, installed BEFORE
      # bundle install so the native extensions compile:
      #   - librdkafka-dev: tina4ruby.gemspec lists rdkafka (dev dep) whose
      #     extension links against librdkafka.
      #   - default-libmysqlclient-dev: mysql2 links against libmysqlclient.
      #   - freetds-dev: tiny_tds links against FreeTDS.
      - name: Install native client libraries (rdkafka, mysql2, tiny_tds)
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev default-libmysqlclient-dev freetds-dev

      # unixODBC + the PostgreSQL ODBC driver (feature 13), installed BEFORE
      # bundle install so ruby-odbc's C extension compiles and links against
      # libodbc (unixodbc-dev). odbc-postgresql ships the driver .so under a
      # multiarch path that differs by Ubuntu release/arch, so it is discovered
      # via `dpkg -L` rather than hardcoded, and registered under the nickname
      # "PostgreSQL Unicode" via `odbcinst -i -d` (the standard unixODBC way to
      # write /etc/odbcinst.ini) — the DSN in TINA4_TEST_ODBC_DSN above references
      # that exact nickname with DRIVER={PostgreSQL Unicode}.
      - name: Install unixODBC + PostgreSQL ODBC driver
        run: |
          sudo apt-get install -y unixodbc unixodbc-dev odbc-postgresql
          driver_so=$(dpkg -L odbc-postgresql | grep -E 'psqlodbcw\.so$' | head -1)
          if [ -z "$driver_so" ]; then
            echo "::error::psqlodbcw.so not found in odbc-postgresql package contents"; exit 1
          fi
          echo "Found PostgreSQL ODBC driver at $driver_so"
          # printf, not a heredoc: a YAML block scalar ("run: |") fixes its
          # indentation from the step's FIRST line, and every later line must
          # stay AT OR ABOVE it or YAML treats the block as having ended early —
          # so a heredoc body flush against the left margin breaks the YAML
          # parse, while one indented to match the script becomes literal
          # leading spaces inside the ini file and breaks odbcinst's parse of
          # "Driver=...". A single printf with explicit \n sidesteps both.
          printf '[PostgreSQL Unicode]\nDescription=PostgreSQL ODBC driver (Unicode)\nDriver=%s\n' "$driver_so" > /tmp/psql-odbc-driver.ini
          sudo odbcinst -i -d -f /tmp/psql-odbc-driver.ini
          odbcinst -q -d | grep -q "PostgreSQL Unicode" || { echo "::error::driver registration failed"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install native Tina4 CLI 3.8.71
        run: |
          cli_dir="$(mktemp -d)"
          trap 'rm -rf "$cli_dir"' EXIT
          curl -fsSLo "$cli_dir/tina4-linux-amd64" https://github.com/tina4stack/tina4/releases/download/v3.8.76/tina4-linux-amd64
          curl -fsSLo "$cli_dir/SHA256SUMS" https://github.com/tina4stack/tina4/releases/download/v3.8.76/SHA256SUMS
          (cd "$cli_dir" && grep ' tina4-linux-amd64$' SHA256SUMS | sha256sum -c -)
          sudo install -m 0755 "$cli_dir/tina4-linux-amd64" /usr/local/bin/tina4
          tina4 --version

      - name: Install dependencies
        run: bundle install

      # PROVE the ruby-odbc gem actually loads AND can drive a real connection
      # through the driver registered above, so a broken DSN / missing driver
      # degrades to a LOUD failure here rather than a quiet, permanent pending
      # skip in the main spec run (the same no-silent-skip guard the dedicated
      # firebird job below uses for the fb gem).
      - name: Verify ruby-odbc gem loads and reaches Postgres (no-silent-skip guard)
        run: |
          bundle exec ruby -e '
            require "odbc"
            db = ODBC::Database.new
            db.drvconnect(ENV.fetch("TINA4_TEST_ODBC_DSN"))
            statement = db.run("SELECT 1")
            statement.fetch
            statement.drop
            db.disconnect
            puts "ruby-odbc loaded OK and reached PostgreSQL through the ODBC driver"
          '

      # ADR-0054: the framework owns only the handoff. CI installs the released
      # native engine above and proves that boundary instead of excluding it.
      - name: Run tests
        run: bundle exec rspec

      # ADR-0024 rule 4: the ZERO-DEPENDENCY default counts double.
      #
      # This job sets BUNDLE_WITH=databases, and that group carries
      # `gem "redis"`, so every run above takes the redis GEM transport.
      # RedisBackend ships TWO transports and the raw RESP socket is what a
      # zero-dependency install actually runs - and nothing gated it. That is
      # exactly how clear() shipped as a literal no-op on the raw path, and how
      # stats reported a hardcoded size of 0 there: both were invisible to CI
      # because a driver happened to be present.
      #
      # The :databases group is optional, so leaving BUNDLE_WITH empty is enough
      # to drop the gem and force the raw path. The abort() is the load-bearing
      # line: without it this leg silently proves nothing the day that group
      # stops being optional.
      - name: Run cache specs on the ZERO-DEPENDENCY transport
        env:
          BUNDLE_WITH: ""
        run: |
          bundle install --quiet
          # `bundle exec ruby`, NOT plain `ruby`. A bare `ruby -e` searches the
          # whole system gem path, so it finds a redis installed anywhere on the
          # runner and reports "still loadable" even when the BUNDLE correctly
          # excludes it. Verified locally: plain ruby said loadable, bundle exec
          # ruby raised LoadError, in the same working tree. The check has to run
          # in the same resolution context as the rspec call below or it is
          # answering a different question.
          bundle exec ruby -e 'begin; require "redis"; abort("redis gem still loadable in the bundle - this leg would prove nothing"); rescue LoadError; puts "confirmed: redis gem absent from the bundle, raw RESP is the only transport"; end'
          bundle exec rspec \
            spec/cache_clear_invalidates_spec.rb spec/cache_key_database_identity_spec.rb \
            spec/cache_provider_selection_spec.rb spec/cache_null_round_trip_spec.rb \
            spec/cache_sweep_counts_spec.rb spec/cache_clear_persistent_layer_spec.rb \
            spec/cache_memcached_exptime_spec.rb spec/cache_backends_spec.rb \
            spec/cache_spec.rb spec/db_query_cache_spec.rb \
            --format progress --format json --out zero-dep-results.json

          # THE FALLBACK TELL. rspec exits 0 when it runs ZERO examples, so a
          # green step is not evidence this leg exercised anything. If the redis
          # service were unreachable, or the file list silently matched nothing,
          # this step would "pass" having proven nothing at all - the mirror
          # image of the gem check above, and just as quiet.
          #
          # example_count is STATIC: `rspec --dry-run` reports 137 with the cache
          # env unset, so no example here is defined conditionally and the floor
          # is exact rather than a guess. Raise it deliberately when examples are
          # added; a DROP below it should fail the build, because a vanished test
          # is exactly what this gate is for.
          #
          # pending must be EXACTLY 0. The job sets TINA4_REQUIRE_SERVICES=1, so
          # a skipped example means a provisioned service was unreachable and the
          # coverage this leg claims did not happen.
          bundle exec ruby -e '
            require "json"
            summary = JSON.parse(File.read("zero-dep-results.json"))["summary"]
            examples = summary["example_count"]
            failures = summary["failure_count"]
            pending  = summary["pending_count"]
            floor    = 137
            puts "zero-dependency leg: examples=#{examples} failures=#{failures} pending=#{pending}"
            abort("FAILED: #{failures} failing examples") unless failures.zero?
            abort("FAILED: #{pending} pending/skipped, expected 0 - a skip means a provisioned service was unreachable, so this leg proved nothing") unless pending.zero?
            abort("FAILED: only #{examples} examples ran, expected at least #{floor} - the raw RESP transport was barely exercised") if examples < floor
            puts "confirmed: the zero-dependency transport was genuinely exercised"
          '

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"

  # Dedicated live-Firebird job (systemic coverage-leak fix). Firebird is NOT a
  # provisioned service in the main `test` job above — its skips stay green there
  # BY DESIGN (the require-services gate in spec/spec_helper.rb excludes the
  # firebird keyword), which is correct for that already-heavy multi-service
  # runner. The consequence, though, was that the Firebird rollback regression
  # spec only ever went PENDING in CI — the exact gap that let the Firebird
  # rollback no-op ship. This job stands up a REAL Firebird 5.0.2, installs the
  # `fb` gem (native driver, linked against libfbclient), and RUNS the firebird
  # specs against it. A NO-SILENT-SKIP guard fails the job if the rollback spec
  # did not actually run its examples (an unset URL / unreachable server / missing
  # fb gem would otherwise leave them green-pending). This is the Ruby twin of
  # the PHP `firebird:` job's `php -m | grep interbase` teeth.
  firebird:
    runs-on: ubuntu-latest
    env:
      TINA4_TEST_FIREBIRD_URL: firebird://SYSDBA:masterkey@localhost:3050//var/lib/firebird/data/test.fdb
      TINA4_TEST_FIREBIRD_USERNAME: SYSDBA
      TINA4_TEST_FIREBIRD_PASSWORD: masterkey
      # Install ONLY the firebird group's `fb` gem on top of the base bundle. The
      # :databases group (mysql2/tiny_tds/redis) is intentionally NOT pulled in —
      # those engines aren't exercised here and their native libs aren't installed.
      BUNDLE_WITH: firebird
    steps:
      - uses: actions/checkout@v4

      # Firebird 5.0.2 as a plain container (a GitHub `services:` block cannot
      # wait for Firebird's first-boot DB creation cleanly). FAIL the job if it
      # never accepts a query, so the coverage has teeth.
      - name: Start Firebird 5.0.2
        run: |
          docker run -d --name tina4-firebird -p 3050:3050 \
            -e FIREBIRD_ROOT_PASSWORD=masterkey \
            -e FIREBIRD_DATABASE=test.fdb \
            firebirdsql/firebird:5.0.2
          echo "Waiting for Firebird to accept connections on :3050 ..."
          for i in $(seq 1 30); do
            if docker exec tina4-firebird /opt/firebird/bin/isql -user SYSDBA -password masterkey \
                 /var/lib/firebird/data/test.fdb -q -o /dev/null <<<'SELECT 1 FROM RDB$DATABASE;' 2>/dev/null; then
              echo "Firebird ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Firebird did not become ready in time"; docker logs tina4-firebird | tail -40; exit 1

      # libfbclient headers + lib so the `fb` gem's native extension compiles and
      # links. Installed BEFORE setup-ruby, whose bundler-cache runs `bundle
      # install` (which builds the extension). Mirrors how the main `test` job
      # installs mysql2/tiny_tds native libs before setup-ruby.
      - name: Install Firebird client dev libraries (libfbclient)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends firebird-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies (incl. fb via BUNDLE_WITH=firebird)
        run: bundle install

      # PROVE the fb gem actually loads (its native ext linked against
      # libfbclient). A LoadError here FAILS the job — it must never degrade the
      # rollback spec to a green pending skip. This is the Ruby equivalent of
      # PHP's `php -m | grep interbase`.
      - name: Verify fb gem loads (no-silent-skip guard)
        run: |
          bundle exec ruby -e "require 'fb'; raise 'Fb module not defined after require' unless defined?(Fb); puts 'fb gem loaded OK (Fb module present)'"

      # Run the live-Firebird rollback regression spec and PROVE its examples
      # RAN (not pending). The spec goes pending when the URL is unset / server
      # unreachable / fb gem missing — and because Firebird is a non-provisioned
      # engine, a pending run is otherwise green. Assert examples ran with 0
      # failures AND that nothing is pending; a single pending example fails.
      #
      # Pin the INVARIANT (>= 1 example, 0 failures, 0 pending), NOT a literal
      # total: a guard written as `grep "3 examples"` goes red the day someone
      # adds a 4th, which is exactly how the Node Firebird guard broke on a
      # fully passing run.
      - name: Run Firebird rollback spec against live Firebird (no-silent-skip guard)
        run: |
          set -o pipefail
          out=$(bundle exec rspec spec/firebird_rollback_spec.rb --format documentation 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -qE "[1-9][0-9]* examples?, 0 failures" || {
            echo "::error::firebird_rollback_spec did not report examples with 0 failures — its live cases did not run."; exit 1; }
          if printf '%s\n' "$out" | grep -qE "[1-9][0-9]* pending"; then
            echo "::error::firebird_rollback_spec had pending (skipped) examples — the live-FB coverage did not run."; exit 1
          fi
          echo "firebird_rollback_spec RAN its examples against live Firebird and passed (0 pending)."

      # The remaining firebird-dedicated specs run here too: charset resolver +
      # URL normaliser are pure-logic; the url spec's live-connectivity block,
      # the reconnect matcher spec, primary-key introspection and column-name
      # case, and the provider contract (feature 12) all need the live server
      # (fb gem present + server up). Before this these three files (primary_key,
      # provider contract, column_case) ran NOWHERE in CI — they gate purely on
      # TINA4_TEST_FIREBIRD_URL (same as the rollback spec above), which the main
      # `test` job never sets by design (see spec/spec_helper.rb's
      # TINA4_GATE_SERVICE_KEYWORDS), so they sat permanently pending there with
      # no live run anywhere. This job already provisions the exact live Firebird
      # + fb gem they need, so reuse it instead of standing up a second server.
      #
      # Same no-silent-skip guard as the rollback step above: PROVE every file
      # actually ran (0 pending) rather than trusting a green exit code, which
      # rspec also returns when every example silently skipped.
      - name: Run remaining Firebird specs (no-silent-skip guard)
        run: |
          set -o pipefail
          out=$(bundle exec rspec spec/firebird_charset_spec.rb spec/firebird_url_spec.rb \
            spec/firebird_reconnect_spec.rb spec/firebird_primary_key_spec.rb \
            spec/firebird_column_case_spec.rb spec/firebirdprovider_contract_spec.rb \
            --format documentation 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -qE "[1-9][0-9]* examples?, 0 failures" || {
            echo "::error::the remaining Firebird specs did not report examples with 0 failures."; exit 1; }
          if printf '%s\n' "$out" | grep -qE "[1-9][0-9]* pending"; then
            echo "::error::the remaining Firebird specs had pending (skipped) examples — some live-FB coverage did not run."; exit 1
          fi
          echo "remaining Firebird specs RAN against live Firebird and passed (0 pending)."
